<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fanmark.id 管理者認証の移行</title>
<style nonce="NONCE">body{font:16px/1.7 system-ui,sans-serif;background:#f4f6f8;color:#17212e;margin:0}main{max-width:620px;margin:48px auto;padding:32px;background:white;border-radius:16px}h1{font-size:24px}label{display:block;margin-top:20px}input[type=password],input[type=text]{display:block;font:inherit;padding:12px;width:100%;box-sizing:border-box;border:1px solid #75818d;border-radius:6px}button{font:inherit;padding:10px 24px;background:#124d8b;color:white;border:0;border-radius:6px;margin-top:24px;cursor:pointer}button:disabled{opacity:.5}#error{color:#a02222}#qr{margin:20px 0}pre{white-space:pre-wrap;word-break:break-all}small{color:#465464}#cancel{background:#e9edf2;color:#17212e;margin-left:12px}@media(max-width:680px){main{margin:12px;padding:24px}}</style>
<main><h1>管理者の認証アプリを再登録</h1><p>この画面は、このMac内だけで動作します。旧環境の認証アプリは削除しないでください。</p><p id="state" aria-live="polite">準備しています…</p><p id="deadline"></p><p id="error" role="alert"></p>
<form id="form" hidden><section id="password-panel"><label for="password">現在の管理者パスワード</label><input id="password" type="password" autocomplete="current-password" maxlength="1024"><small>現在のSupabaseで本人確認を行います。</small></section>
<section id="new-panel" hidden><p>認証アプリで下のQRコードを読み取り、「fanmark.id Cloudflare」を追加してください。</p><div id="qr"></div><details><summary>手動入力用のキー</summary><pre id="manual"></pre></details><p>次の復旧コードをパスワード管理アプリなどに保存してください。</p><pre id="backups"></pre><label><input type="checkbox" id="saved">復旧コードを保存しました</label></section>
<section id="code-panel" hidden><label for="code" id="code-label">認証コード</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></section>
<button id="submit">本人確認を進める</button><button type="button" id="cancel">中止</button></form>
<p><small>パスワード・認証コードをチャットに送る必要はありません。登録できても、本番のデータ移送・公開は別の検証が完了してから行います。</small></p></main>
<script nonce="NONCE">
const $=id=>document.getElementById(id);let stage='password';
const failures={input:'入力形式を確認してください。認証コードは6桁です。','source-password':'旧環境へのログインを確認できませんでした。現在の管理者パスワードを確認して再試行してください。','source-identity':'旧環境の管理者情報を確認できませんでした。チャットで知らせてください。','source-challenge':'旧環境の認証確認を開始できませんでした。チャットで知らせてください。','source-totp':'旧認証アプリのコードを確認できませんでした。コードが更新されたら再試行してください。','source-assurance':'旧認証の結果を照合できませんでした。チャットで知らせてください。','source-readback':'管理者情報の照合で停止しました。チャットで知らせてください。','target-setup':'新しい認証の準備で停止しました。チャットで知らせてください。','target-totp':'新しい認証アプリのコードを確認できませんでした。新しいQRで追加した項目のコードで再試行してください。','target-login':'新しい認証の再ログイン検査で停止しました。チャットで知らせてください。','target-login-totp':'再ログイン時のコード確認ができませんでした。新しいコードで再試行してください。','target-assurance':'新しい認証の管理権限検査で停止しました。チャットで知らせてください。','final-source-readback':'最終照合で停止しました。チャットで知らせてください。',save:'移行用の登録結果を保存できませんでした。チャットで知らせてください。'};
function render(s){stage=s.stage;if(s.expiresAt)$('deadline').textContent='この画面の期限：'+new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}).format(new Date(s.expiresAt))+'（日本時間）';if(s.lastFailure)$('error').textContent=failures[s.lastFailure]||'処理を確認できませんでした。チャットで知らせてください。';if(stage==='done')$('error').textContent='';$('form').hidden=['done','closed'].includes(stage);$('password-panel').hidden=stage!=='password';$('code-panel').hidden=!['old-totp','new-totp'].includes(stage);$('password').required=stage==='password';$('code').required=['old-totp','new-totp'].includes(stage);$('code-label').textContent=stage==='old-totp'?'旧環境の認証アプリの6桁コード':'新しい「fanmark.id Cloudflare」の6桁コード';$('state').textContent=({password:'1 / 3　旧環境の本人確認', 'old-totp':'2 / 3　旧環境の二段階認証', 'new-totp':'3 / 3　新しい認証アプリの登録',done:'新しい認証の登録と再ログイン確認が完了しました。暗号化した移行用データを保存しました。旧環境の認証も引き続き保持してください。',closed:s.expired?'有効期限が切れました。再登録は完了していません。チャットで再開を知らせてください。':'この画面での操作を続けられません。完了状況はチャットで確認してください。'})[stage]||'終了しました';$('submit').textContent=stage==='new-totp'?'新しい認証を確認して保存':'本人確認を進める';if(s.qrSvg){$('new-panel').hidden=false;$('qr').innerHTML=s.qrSvg;$('manual').textContent=new URL(s.totpURI).searchParams.get('secret');$('backups').textContent=s.backupCodes.join('\n');}if(['done','closed'].includes(stage)){$('qr').replaceChildren();$('manual').textContent='';$('backups').textContent='';$('password').value='';$('code').value='';$('new-panel').hidden=true;}}
async function request(path,body,headers={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...headers},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'操作を確認できませんでした。');return d;}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';if(stage==='new-totp'&&!$('saved').checked){$('error').textContent='復旧コードを保存してから進めてください。';return;}$('submit').disabled=true;const body=stage==='password'?{password:$('password').value}:{code:$('code').value};$('password').value='';$('code').value='';try{render(await request('/step',body));}catch{$('error').textContent='確認に失敗しました。入力を確認し、コードが更新されたら再試行してください。';try{render(await request('/status',{}));}catch{render({stage:'closed'});}}finally{$('submit').disabled=false;}});
$('cancel').onclick=async()=>{try{await request('/close',{});}finally{render({stage:'closed'});}};
(async()=>{const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);try{render(await request(token?'/bootstrap':'/status',{},token?{Authorization:'Bearer '+token}:{}));}catch{render({stage:'closed'});}})();
</script></html>
