name: Supabase CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check workflow isolation
        run: npm run check:ci

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy Supabase production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    environment:
      name: Supabase
    permissions:
      contents: write

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment configuration
        run: |
          test -n "$SUPABASE_PROJECT_ID" || { echo "Error: SUPABASE_PROJECT_ID is not set"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Error: SUPABASE_DB_PASSWORD is not set"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Error: SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          echo "Supabase deployment configuration is present"

      - name: Link Supabase project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Run migrations
        run: supabase db push

      - name: Generate types
        run: |
          supabase gen types typescript --linked > src/integrations/supabase/types.ts

      - name: Commit updated types
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/integrations/supabase/types.ts
          git diff --staged --quiet || git commit -m "Update Supabase types [skip ci]"
          git push
