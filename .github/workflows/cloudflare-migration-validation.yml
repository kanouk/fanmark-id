name: Cloudflare application validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    # Keep the existing check name for repository protection compatibility.
    name: Validate Cloudflare staging application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install application dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Worker tools for actual local tests
        run: npm ci --prefix workers/api
      - name: Verify CI isolation
        run: npm run check:ci
      - name: Verify frontend types, lint, clients, current operational contracts and configuration
        run: npm run verify:app
      - name: Verify actual local Worker, MFA and desktop mobile flows
        env:
          FANMARK_TEST_ARTIFACT_DIR: ${{ runner.temp }}/fanmark-local-browser
        run: npm run test:local
      - name: Verify real local invitation signup and owner editor persistence
        run: npm run test:staging-invitation-signup-local
      - name: Verify owner editor with actual local Worker and R2 images
        run: npm run test:staging-profile-editor-local
      - name: Build staging frontend for isolated failure and draft checks
        run: npm run build:cloudflare-staging
      - name: Verify editor cold start, failed save, draft recovery and owner refusals
        run: npm run test:staging-profile-editor-ui
      - name: Verify combined Business Auth Master and R2 recovery
        run: npm run test:combined-recovery
      - name: Build accepted production application
        run: npm run build
      - name: Validate active production configuration and bundles without deployment
        run: npm run build:cloudflare-production-live:dry-run

  worker:
    name: Validate Cloudflare Worker API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Verify Worker types
        run: npm run typecheck
      - name: Verify complete current Worker contracts and recovery
        run: npm test
      - name: Verify current Business and Auth runtime import
        run: npm run test:business-runtime-import
      - name: Validate Worker bundle without deployment
        run: npm run build:dry-run
